<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe: web inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: #FFFFFF; color: #333333; font-family: 'JetBrains Mono', monospace; font-size: 13px">
<nav style="width: 264px; flex-shrink: 0; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 10px; background: #F5F5F5; border-right: 1px solid #BDBDBD">
<div style="display: flex; justify-content: space-between"><b>Brain</b><span style="padding: 2px 10px; border-radius: 10px; color: #FFFFFF; background: #555555">Add</span></div>
<span style="height: 34px; border-radius: 8px; border: 1px solid #BDBDBD; display: flex; align-items: center; padding: 0 10px; color: #999999">Search</span>
<span style="color: #777777; margin-top: 8px">VIEWS</span>
<sc-for list="{{views}}" as="v" hint-placeholder-count="5"><span style="display: flex; justify-content: space-between"><span>{{v}}</span><span style="color: #999999">00</span></span></sc-for>
<span style="color: #777777; margin-top: 8px">CATEGORIES</span>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="6"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #999999"></span><span style="height: 8px; border-radius: 4px; background: #D6D6D6; width: {{b}}px"></span></span></sc-for>
<span style="color: #777777; margin-top: 8px">TAGS</span>
<span># tag</span><span># tag</span>
<span style="flex-grow: 1"></span>
<a href="WSources.dc.html" style="text-decoration: none; color: #333333">Sources and settings</a>
<span>Sign out</span>
</nav>
<main style="flex-grow: 1; padding: 28px 32px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 12px"><span style="flex-grow: 1; height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; border: 1px solid #999999; color: #999999">Search by word, @handle or topic</span><a href="WAdd.dc.html" style="height: 44px; padding: 0 20px; display: flex; align-items: center; border-radius: 22px; text-decoration: none; color: #FFFFFF; background: #555555">+ Add</a></div>
<div style="display: flex; gap: 8px; align-items: center"><sc-for list="{{chips}}" as="c" hint-placeholder-count="6"><span style="height: 30px; padding: 0 12px; display: flex; align-items: center; border-radius: 15px; border: 1px solid #BDBDBD">{{c}}</span></sc-for><span style="flex-grow: 1"></span><span>[x] Blur sensitive</span></div>
<div style="height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-radius: 10px; background: #F5F5F5"><span>Claude sorting: status</span><span style="padding: 4px 10px; border: 1px solid #BDBDBD; border-radius: 12px">Sort now</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 18px; align-items: start">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{col}}" as="h" hint-placeholder-count="2">
<a href="WItem.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; border: 1px solid #BDBDBD; text-decoration: none; color: #333333">
<span style="display: flex; gap: 10px; align-items: center"><span style="width: 32px; height: 32px; border-radius: 16px; background: #EDEDED"></span><span style="width: 120px; height: 10px; border-radius: 5px; background: #BDBDBD"></span><span style="margin-left: auto; padding: 2px 6px; border: 1px solid #BDBDBD; border-radius: 4px; color: #777777">SRC</span></span>
<span style="height: 10px; border-radius: 5px; background: #D6D6D6"></span><span style="height: 10px; border-radius: 5px; background: #D6D6D6; width: 70%"></span>
<span style="height: {{h}}px; border-radius: 10px; background: #EDEDED"></span>
<span style="padding: 6px 8px; border-radius: 8px; background: #F5F5F5; color: #777777">Claude's summary</span>
<span style="display: flex; gap: 6px"><span style="padding: 3px 10px; border-radius: 12px; background: #EDEDED">Category</span><span style="padding: 3px 8px; border-radius: 12px; background: #F5F5F5">#tag</span></span>
</a>
</sc-for>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { views: ['Inbox', 'All', 'Archive', 'With media', 'Sensitive'], bars: [150, 170, 140, 160, 180, 130], chips: ['All', 'X', 'IG', 'YT', 'Feedly', 'EN', 'AR'], cols: [[0, 150], [0, 0], [150, 0]] }; }
}
</script>
</body>
</html>
