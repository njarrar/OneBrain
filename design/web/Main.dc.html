<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brain inbox on the web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Arabic:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Space Grotesk', system-ui, sans-serif">
<dc-import name="Sidebar" theme="{{theme}}" active="Inbox" hint-size="264px,900px"></dc-import>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto">
<div style="display: flex; gap: 12px">
<label style="flex-grow: 1; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 14px; background: {{t.card}}; border: 1px solid {{t.line}}; box-shadow: 0 3px 0 {{t.shadow}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color: {{t.soft}}; flex-shrink: 0"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search" placeholder="Search by word, @handle, or topic, in English or Arabic" style="border: 0; outline: 0; width: 100%; background: transparent; font: inherit; font-size: 15px; color: {{t.ink}}">
</label>
<a href="Add.dc.html" style="height: 46px; padding: 0 22px; display: flex; align-items: center; border-radius: 23px; font-weight: 600; text-decoration: none; background: {{t.accent}}; color: {{t.onAccent}}">+ Add</a>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" style="height: 34px; padding: 0 14px; border-radius: 17px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid {{t.line}}; background: {{c.bg}}; color: {{t.ink}}">{{c.label}}</button>
</sc-for>
<span style="flex-grow: 1"></span>
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer"><input type="checkbox" checked onChange="{{noop}}" style="width: 18px; height: 18px; accent-color: {{t.accent}}">Blur sensitive</label>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; font-size: 14px; background: {{t.chip}}">
<span style="font-weight: 600">Claude sorting</span>
<span style="color: {{t.soft}}">All sorted. New saves get a category and tags within a minute.</span>
<span style="flex-grow: 1"></span>
<button type="button" style="height: 32px; padding: 0 14px; border-radius: 16px; font: inherit; font-size: 13px; cursor: pointer; background: {{t.card}}; border: 1px solid {{t.line}}; color: {{t.ink}}">Sort now</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 18px; align-items: start">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{col}}" as="item" hint-placeholder-count="2">
<a href="Item.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; text-decoration: none; color: inherit; background: {{t.card}}; border: 1px solid {{t.line}}; border-top: 3px solid {{item.color}}; box-shadow: 0 3px 0 {{t.shadow}}">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 34px; height: 34px; border-radius: 17px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; background: {{t.chip}}; color: {{item.color}}">{{item.initial}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 15px">{{item.author}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{t.soft}}">{{item.handle}} · {{item.date}}</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px; border: 1px solid {{t.line}}; color: {{t.soft}}">{{item.source}}</span>
</div>
<div dir="{{item.dir}}" style="font-size: 15px; line-height: 1.5; font-family: {{item.font}}">{{item.text}}</div>
<sc-if value="{{item.media}}" hint-placeholder-val="{{item.media}}">
<div style="height: 170px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; background: {{t.chip}}; border: 1px dashed {{t.line}}; color: {{t.soft}}">[Picture from the post]</div>
</sc-if>
<div style="padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; background: {{t.bg}}; color: {{t.soft}}">{{item.summary}}</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; background: {{t.chip}}"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{item.color}}"></span>{{item.category}}</span><span style="padding: 4px 8px; border-radius: 12px; font-size: 12px; background: {{t.chip}}; color: {{t.soft}}">#{{item.tag}}</span></div>
</a>
</sc-for>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sunroom-light","sunroom-dark","vault-dark","vault-light"],"default":"sunroom-light"},"$preview":{"width":1440,"height":900}}'>
var THEMES = {
  'sunroom-light': { bg: '#FAF7F0', panel: '#F5F0E6', card: '#FFFDF8', line: '#E6DCC8', ink: '#2A2620', soft: '#6F6656', accent: '#D98F3F', accentText: '#A15F16', onAccent: '#2A2620', chip: '#F2ECE0', pick: '#FBE3C8', shadow: '#E8DFCE' },
  'sunroom-dark': { bg: '#1C1A16', panel: '#211F1A', card: '#26231E', line: '#3A342B', ink: '#F3EDE2', soft: '#AAA08F', accent: '#E3A459', accentText: '#E3A459', onAccent: '#1C1A16', chip: '#302C25', pick: '#3A2F20', shadow: '#12110E' },
  'vault-dark': { bg: '#0B0F17', panel: '#101622', card: '#151D2B', line: '#232F44', ink: '#F1F5F9', soft: '#94A3B8', accent: '#F59E0B', accentText: '#F59E0B', onAccent: '#0B0F17', chip: '#1E293B', pick: '#2A2413', shadow: '#05070B' },
  'vault-light': { bg: '#F4F6F9', panel: '#EDF1F6', card: '#FFFFFF', line: '#DDE3EB', ink: '#0F172A', soft: '#5B6778', accent: '#D97706', accentText: '#B45309', onAccent: '#0F172A', chip: '#EBEFF5', pick: '#FDEBD3', shadow: '#DDE3EB' }
};
var LATIN = "'Space Grotesk', system-ui, sans-serif";
var ARABIC = "'IBM Plex Sans Arabic', 'Space Grotesk', sans-serif";
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { chip: 'All' }; }
  renderVals() {
    var theme = this.props.theme || 'sunroom-light';
    var t = THEMES[theme] || THEMES['sunroom-light'];
    var self = this;
    var chips = ['All', 'X', 'Instagram', 'YouTube', 'Feedly', 'English', 'العربية'].map(function (label) {
      return { label: label, bg: self.state.chip === label ? t.chip : t.card, pick: function () { self.setState({ chip: label }); } };
    });
    function it(author, handle, date, source, color, text, summary, category, tag, media, arabic) {
      return { author: author, initial: author.charAt(0), handle: handle, date: date, source: source, color: color, text: text, summary: summary, category: category, tag: tag, media: media, dir: arabic ? 'rtl' : 'ltr', font: arabic ? ARABIC : LATIN };
    }
    var cols = [
      [it('Lina Haddad', '@linabuilds', 'Sep 27', 'X', '#0EA5E9', "We cut our agent's token bill by 60% in a week. Three changes: cache the long system prompt, batch 20 items per call, and stop sending the full history.", "How one team cut an agent's API bill by 60%.", 'AI, Code & Dev Tools', 'agents', false, false),
       it('Middle East Eye', '@MiddleEastEye', 'Sep 19', 'X', '#F59E0B', 'Why the new corridor through the Gulf changes trade routes for the whole region, explained in one thread.', 'A map of the new Gulf trade corridor.', 'MENA Geopolitics & Society', 'trade', true, false)],
      [it('Stratechery', 'stratechery.com', 'Sep 18', 'Feedly', '#10B981', "Aggregation theory, ten years on: what held and what didn't.", 'A look back at a core idea about platforms.', 'Markets, Startups & Finance', 'strategy', false, false),
       it('Levant Notes', '@levant_notes', 'Sep 26', 'X', '#F59E0B', 'لماذا المياه هي مركز السياسة الخارجية للأردن: سلسلة عن نهر اليرموك وحوض الديسي.', "Why water sits at the center of Jordan's foreign policy.", 'MENA Geopolitics & Society', 'water', false, true)],
      [it('Monocle', 'monocle.com', 'Sep 15', 'Manual', '#EAB308', 'The quiet revival of the unstructured linen jacket.', 'Menswear piece to read this weekend.', 'Menswear, Design & Travel', 'style', true, false),
       it('Peter Attia', '@PeterAttiaMD', 'Sep 12', 'YouTube', '#14B8A6', "Zone 2 training: how much is enough, and how to tell you're in it.", 'Video on easy cardio and how to measure it.', 'Health, Biotech & Longevity', 'health', false, false)]
    ];
    return { t: t, theme: theme, chips: chips, cols: cols, noop: function () {} };
  }
}
</script>
</body>
</html>
