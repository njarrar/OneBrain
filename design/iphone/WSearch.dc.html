<div style="display: flex; flex-direction: column; border: 1px solid #BDBDBD; border-radius: 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<a href="WItem.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-bottom: 1px solid #E3E3E3; text-decoration: none; color: #333333"><span style="display: flex; justify-content: space-between"><span style="width: 120px; height: 10px; border-radius: 5px; background: #BDBDBD"></span><span style="color: #999999">SRC · date</span></span><span>text with <b style="background: #E3E3E3">match</b> shown</span></a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return { rows: [1, 2, 3] }; }
}
</script>
