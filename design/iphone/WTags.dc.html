<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe: tags</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 58px 16px 24px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; color: #333333; font-family: 'JetBrains Mono', monospace; font-size: 12px">
<div style="display: flex; align-items: center; justify-content: space-between"><a href="WMenu.dc.html" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #777777; border: 1px solid #BDBDBD">Back</a><span style="font-size: 16px; font-weight: 500">Tags</span><span style="width: 44px"></span></div>
<span style="height: 42px; display: flex; align-items: center; padding: 0 14px; border-radius: 21px; border: 1px solid #BDBDBD; color: #999999">Find a tag</span>
<div style="display: flex; gap: 8px"><span style="height: 32px; padding: 0 12px; display: flex; align-items: center; border-radius: 16px; background: #EDEDED; border: 1px solid #999999">Most used</span><span style="height: 32px; padding: 0 12px; display: flex; align-items: center; border-radius: 16px; border: 1px solid #BDBDBD">A to Z</span></div>
<div style="display: flex; flex-direction: column; border: 1px solid #BDBDBD; border-radius: 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<a href="WInbox.dc.html" style="height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #E3E3E3; text-decoration: none; color: #333333"><span style="color: #999999">#</span><span style="height: 8px; border-radius: 4px; background: #D6D6D6; width: {{r}}px"></span><span style="margin-left: auto; color: #999999">00</span></a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { rows: [60, 90, 70, 110, 50, 80, 100, 65, 75, 55] }; }
}
</script>
</body>
</html>
