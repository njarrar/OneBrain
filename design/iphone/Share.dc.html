<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save to Brain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: #6B6558; color: {{t.ink}}; font-family: 'Space Grotesk', system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 40px; border-radius: 22px 22px 0 0; background: {{t.bg}}">
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; font: inherit; font-size: 16px; cursor: pointer; color: {{t.accentText}}">Cancel</button>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">Save to Brain</h1>
<button type="button" onClick="{{save}}" style="min-height: 40px; padding: 0 16px; border-radius: 20px; border: 0; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; background: {{t.accent}}; color: {{t.onAccent}}">Save</button>
</div>
<div style="display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: {{t.card}}; border: 1px solid {{t.line}}">
<div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; background: {{t.chip}}; display: flex; align-items: center; justify-content: center; font-size: 11px; color: {{t.soft}}">[Picture]</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="font-size: 15px; font-weight: 600">Post from Instagram</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.soft}}">instagram.com/p/...</div>
</div>
</div>
<textarea rows="3" aria-label="Note" placeholder="Add a note (optional)" style="padding: 12px; border-radius: 14px; outline: 0; resize: none; font: inherit; font-size: 15px; background: {{t.card}}; border: 1px solid {{t.line}}; color: {{t.ink}}"></textarea>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<div role="status" style="min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; font-weight: 600; background: {{t.chip}}; color: #15803D">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Saved
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sunroom-light","sunroom-dark","vault-dark","vault-light"],"default":"sunroom-light"},"$preview":{"width":390,"height":844}}'>
var THEMES = {
  'sunroom-light': { bg: '#FAF7F0', card: '#FFFDF8', line: '#E6DCC8', ink: '#2A2620', soft: '#6F6656', accent: '#D98F3F', accentText: '#A15F16', onAccent: '#2A2620', chip: '#F2ECE0', shadow: '#E8DFCE' },
  'sunroom-dark': { bg: '#1C1A16', card: '#26231E', line: '#3A342B', ink: '#F3EDE2', soft: '#AAA08F', accent: '#E3A459', accentText: '#E3A459', onAccent: '#1C1A16', chip: '#302C25', shadow: '#12110E' },
  'vault-dark': { bg: '#0B0F17', card: '#151D2B', line: '#232F44', ink: '#F1F5F9', soft: '#94A3B8', accent: '#F59E0B', accentText: '#F59E0B', onAccent: '#0B0F17', chip: '#1E293B', shadow: '#05070B' },
  'vault-light': { bg: '#F4F6F9', card: '#FFFFFF', line: '#DDE3EB', ink: '#0F172A', soft: '#5B6778', accent: '#D97706', accentText: '#B45309', onAccent: '#0F172A', chip: '#EBEFF5', shadow: '#DDE3EB' }
};
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { saved: false }; }
  renderVals() {
    var self = this;
    return { t: THEMES[this.props.theme] || THEMES['sunroom-light'], saved: this.state.saved, save: function () { self.setState({ saved: true }); } };
  }
}
</script>
</body>
</html>
