<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brain search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Arabic:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; padding: 58px 16px 40px; display: flex; flex-direction: column; gap: 14px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Space Grotesk', system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 10px">
<label style="flex-grow: 1; height: 46px; border-radius: 23px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: {{t.card}}; border: 2px solid {{t.accent}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color: {{t.soft}}; flex-shrink: 0"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search" value="water" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; width: 100%; color: {{t.ink}}">
</label>
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 16px; color: {{t.accentText}}; text-decoration: none">Cancel</a>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{scopes}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" style="min-height: 36px; padding: 0 14px; border-radius: 18px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid {{t.line}}; background: {{c.bg}}; color: {{t.ink}}">{{c.label}}</button>
</sc-for>
</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.soft}}">3 results for "water"</div>
<div style="display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; background: {{t.card}}; border: 1px solid {{t.line}}">
<sc-for list="{{results}}" as="r" hint-placeholder-count="3">
<a href="Item.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-bottom: 1px solid {{t.line}}; color: inherit; text-decoration: none">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: {{r.color}}"></span>
<span style="font-size: 14px; font-weight: 600; flex-grow: 1">{{r.author}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{t.soft}}">{{r.source}} · {{r.date}}</span>
</div>
<div dir="{{r.dir}}" style="font-size: 14px; line-height: 1.45; font-family: {{r.font}}">{{r.before}}<mark style="padding: 0 2px; border-radius: 3px; background: {{t.chip}}; color: {{t.accentText}}; font-weight: 600">{{r.hit}}</mark>{{r.after}}</div>
</a>
</sc-for>
</div>
<div style="font-size: 13px; color: {{t.soft}}">Search looks in the text, your notes, tags and Claude's summaries.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["sunroom-light","sunroom-dark","vault-dark","vault-light"],"default":"sunroom-light"},"$preview":{"width":390,"height":844}}'>
var THEMES = {
  'sunroom-light': { bg: '#FAF7F0', card: '#FFFDF8', line: '#E6DCC8', ink: '#2A2620', soft: '#6F6656', accent: '#D98F3F', accentText: '#A15F16', onAccent: '#2A2620', chip: '#F2ECE0', shadow: '#E8DFCE' },
  'sunroom-dark': { bg: '#1C1A16', card: '#26231E', line: '#3A342B', ink: '#F3EDE2', soft: '#AAA08F', accent: '#E3A459', accentText: '#E3A459', onAccent: '#1C1A16', chip: '#302C25', shadow: '#12110E' },
  'vault-dark': { bg: '#0B0F17', card: '#151D2B', line: '#232F44', ink: '#F1F5F9', soft: '#94A3B8', accent: '#F59E0B', accentText: '#F59E0B', onAccent: '#0B0F17', chip: '#1E293B', shadow: '#05070B' },
  'vault-light': { bg: '#F4F6F9', card: '#FFFFFF', line: '#DDE3EB', ink: '#0F172A', soft: '#5B6778', accent: '#D97706', accentText: '#B45309', onAccent: '#0F172A', chip: '#EBEFF5', shadow: '#DDE3EB' }
};
var LATIN = "'Space Grotesk', system-ui, sans-serif";
var ARABIC = "'IBM Plex Sans Arabic', 'Space Grotesk', sans-serif";
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { scope: 'Everything' }; }
  renderVals() {
    var t = THEMES[this.props.theme] || THEMES['sunroom-light'];
    var self = this;
    var scopes = ['Everything', 'Inbox', 'Notes', 'Archive'].map(function (label) {
      return { label: label, bg: self.state.scope === label ? t.chip : t.card, pick: function () { self.setState({ scope: label }); } };
    });
    var results = [
      { author: 'Levant Notes', source: 'X', date: 'Sep 26', color: '#F59E0B', dir: 'rtl', font: ARABIC, before: 'لماذا ', hit: 'المياه', after: ' هي مركز السياسة الخارجية للأردن' },
      { author: 'Middle East Eye', source: 'X', date: 'Sep 19', color: '#F59E0B', dir: 'ltr', font: LATIN, before: 'The Gulf corridor and the ', hit: 'water', after: ' deals behind it, in one thread.' },
      { author: 'Peter Attia', source: 'YouTube', date: 'Sep 12', color: '#14B8A6', dir: 'ltr', font: LATIN, before: 'How much ', hit: 'water', after: ' you need on a long Zone 2 ride.' }
    ];
    return { t: t, scopes: scopes, results: results };
  }
}
</script>
</body>
</html>
