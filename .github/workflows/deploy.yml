name: deploy
# Publishes the app to Cloudflare on every push to main:
# applies new database migrations, then builds and deploys the Worker.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply DB --remote
      # The search-by-meaning index. Made once; later runs find it and move on.
      - run: npx wrangler vectorize get digital-brain-items || npx wrangler vectorize create digital-brain-items --dimensions=1024 --metric=cosine
      - run: npm run deploy
