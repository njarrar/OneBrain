# Generate the Xcode project with: brew install xcodegen && xcodegen
name: Brain
options:
  bundleIdPrefix: com.njarrar
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
targets:
  Brain:
    type: application
    platform: iOS
    scheme: {}   # gives Xcode a Brain scheme, so Run works after xcodegen
    sources: [Brain, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.njarrar.brain
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Brain/Brain.entitlements
        INFOPLIST_FILE: Brain/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # The build script below writes into the built Info.plist and reads git.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Stamps the git commit and build time into the app, for the bottom of Settings.
      # It runs after Xcode writes Info.plist (a post-compile step would be overwritten).
      - name: Stamp build info
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo dev)
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for key in BrainCommit BrainBuiltAt; do /usr/libexec/PlistBuddy -c "Delete :$key" "$plist" 2>/dev/null || true; done
          /usr/libexec/PlistBuddy -c "Add :BrainCommit string $commit" "$plist"
          /usr/libexec/PlistBuddy -c "Add :BrainBuiltAt string $built" "$plist"
    dependencies:
      - target: BrainShare
  BrainShare:
    type: app-extension
    platform: iOS
    sources: [BrainShare, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.njarrar.brain.share
        CODE_SIGN_ENTITLEMENTS: BrainShare/BrainShare.entitlements
        INFOPLIST_FILE: BrainShare/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
